<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 940 292" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ah2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#676470"/></marker>
    <marker id="ahf2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#ed217c"/></marker>
  </defs>
  <!-- bracket -->
  <text x="470" y="14" font-size="13.5" fill="#1f476b" text-anchor="middle">&#120139; = max<tspan dy="3" font-size="10">c</tspan><tspan dy="-3"> &#8728; &#120124;</tspan><tspan dy="3" font-size="10">&#958;&#8242;</tspan><tspan dy="-3"> &#8728; &#120126; &#8728; &#120130;</tspan><tspan dy="3" font-size="10">g</tspan><tspan dy="-3"> &#8212; one arrow between function spaces</tspan></text>
  <line x1="90" y1="26" x2="850" y2="26" stroke="#ced4da" stroke-width="1.1"/>
  <line x1="90" y1="26" x2="90" y2="33" stroke="#ced4da" stroke-width="1.1"/>
  <line x1="850" y1="26" x2="850" y2="33" stroke="#ced4da" stroke-width="1.1"/>
  <!-- top row: function spaces as objects, operators as arrows -->
  <rect x="90" y="56" width="64" height="36" rx="6" fill="#fff" stroke="#1f476b" stroke-width="2"/>
  <text x="122" y="79" font-size="14.5" fill="#1f476b" text-anchor="middle">&#8477;<tspan dy="-5" font-size="10.5">X</tspan></text>
  <line x1="154" y1="74" x2="229" y2="74" stroke="#676470" stroke-width="1.7" marker-end="url(#ah2)"/>
  <text x="192" y="48" font-size="13" fill="#2f8f3d" text-anchor="middle">&#120130;<tspan dy="3" font-size="9.5">g</tspan></text>
  <rect x="234" y="56" width="96" height="36" rx="6" fill="#fff" stroke="#1f476b" stroke-width="2"/>
  <text x="282" y="79" font-size="14.5" fill="#1f476b" text-anchor="middle">&#8477;<tspan dy="-5" font-size="10.5">X&#215;A&#215;Z</tspan></text>
  <line x1="330" y1="74" x2="405" y2="74" stroke="#676470" stroke-width="1.7" marker-end="url(#ah2)"/>
  <text x="368" y="48" font-size="13" fill="#b4451e" text-anchor="middle">&#120126; : u + &#946;&#183;</text>
  <rect x="410" y="56" width="96" height="36" rx="6" fill="#fff" stroke="#1f476b" stroke-width="2"/>
  <text x="458" y="79" font-size="14.5" fill="#1f476b" text-anchor="middle">&#8477;<tspan dy="-5" font-size="10.5">X&#215;A&#215;Z</tspan></text>
  <line x1="506" y1="74" x2="581" y2="74" stroke="#676470" stroke-width="1.7" marker-end="url(#ah2)"/>
  <text x="544" y="48" font-size="13" fill="#0b7fae" text-anchor="middle">&#120124;<tspan dy="3" font-size="9.5">&#958;&#8242;</tspan></text>
  <rect x="586" y="56" width="80" height="36" rx="6" fill="#fff" stroke="#1f476b" stroke-width="2"/>
  <text x="626" y="79" font-size="14.5" fill="#1f476b" text-anchor="middle">&#8477;<tspan dy="-5" font-size="10.5">X&#215;A</tspan></text>
  <line x1="666" y1="74" x2="741" y2="74" stroke="#676470" stroke-width="1.7" marker-end="url(#ah2)"/>
  <text x="704" y="48" font-size="13" fill="#c41230" text-anchor="middle">max<tspan dy="3" font-size="9.5">c</tspan></text>
  <rect x="746" y="56" width="64" height="36" rx="6" fill="#fff" stroke="#1f476b" stroke-width="2"/>
  <text x="778" y="79" font-size="14.5" fill="#1f476b" text-anchor="middle">&#8477;<tspan dy="-5" font-size="10.5">X</tspan></text>
  <!-- lift arrows -->
  <line x1="122" y1="196" x2="122" y2="98" stroke="#ed217c" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ahf2)"/>
  <line x1="282" y1="196" x2="282" y2="98" stroke="#ed217c" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ahf2)"/>
  <text x="540" y="146" font-size="12.5" fill="#ed217c" text-anchor="middle">&#8477;<tspan dy="-5" font-size="9">(&#8212;)</tspan><tspan dy="5"> &#8212; the lift: a functor, and it reverses the arrow</tspan></text>
  <text x="540" y="166" font-size="11" fill="#676470" text-anchor="middle">state maps run forward; value maps run backward &#8212; backward induction, categorically</text>
  <!-- bottom row: declared first-order transition, running the other way -->
  <rect x="100" y="200" width="44" height="32" rx="6" fill="#fff" stroke="#39b54a" stroke-width="2"/>
  <text x="122" y="221" font-size="13.5" fill="#212529" text-anchor="middle">X</text>
  <line x1="230" y1="216" x2="150" y2="216" stroke="#676470" stroke-width="1.7" marker-end="url(#ah2)"/>
  <text x="190" y="206" font-size="13" fill="#39b54a" text-anchor="middle">g</text>
  <rect x="234" y="200" width="96" height="32" rx="6" fill="#fff" stroke="#39b54a" stroke-width="2"/>
  <text x="282" y="221" font-size="13.5" fill="#212529" text-anchor="middle">X &#215; A &#215; Z</text>
  <!-- captions -->
  <text x="470" y="262" font-size="12" fill="#676470" text-anchor="middle">the declared data are first-order &#8212; g(m, c, &#958;&#8242;) = R(m &#8722; c) + &#958;&#8242;, the reward u, and &#946;; every function space and operator in the top row is induced</text>
  <text x="470" y="282" font-size="12.5" fill="#1f476b" text-anchor="middle">&#120139;v(m) = max<tspan dy="3" font-size="9.5">c</tspan><tspan dy="-3"> { u(c) + &#946; &#120124;</tspan><tspan dy="3" font-size="9.5">&#958;&#8242;</tspan><tspan dy="-3"> v(R(m &#8722; c) + &#958;&#8242;) }</tspan></text>
</svg>
