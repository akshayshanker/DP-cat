  <line x1="45" y1="92" x2="38" y2="106" stroke="#adb5bd" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="65" y1="92" x2="72" y2="106" stroke="#adb5bd" stroke-width="1.2" stroke-dasharray="3,3"/>
