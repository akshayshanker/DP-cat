  <line x1="129" y1="92" x2="125" y2="99" stroke="#adb5bd" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="145" y1="92" x2="149" y2="99" stroke="#adb5bd" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="137" y="104" font-size="11" fill="#9aa0a6" text-anchor="middle">&#8943;</text>
