<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 30 380 200" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="cb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#495057"/></marker>
  </defs>
  <!-- front face: A(80,80) B(240,80) C(80,220) D(240,220); back face: A'(160,40) B'(320,40) C'(160,180) D'(320,180) -->
  <!-- back face edges (those meeting the occluded vertex C' are dashed) -->
  <line x1="168" y1="40" x2="310" y2="40" stroke="#495057" stroke-width="1.5" marker-end="url(#cb)"/>
  <line x1="160" y1="50" x2="160" y2="168" stroke="#495057" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#cb)"/>
  <line x1="320" y1="50" x2="320" y2="168" stroke="#495057" stroke-width="1.5" marker-end="url(#cb)"/>
  <line x1="168" y1="180" x2="310" y2="180" stroke="#495057" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#cb)"/>
  <!-- depth edges, front to back -->
  <line x1="88" y1="76" x2="152" y2="44" stroke="#495057" stroke-width="1.5" marker-end="url(#cb)"/>
  <line x1="248" y1="76" x2="312" y2="44" stroke="#495057" stroke-width="1.5" marker-end="url(#cb)"/>
  <line x1="88" y1="216" x2="152" y2="184" stroke="#495057" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#cb)"/>
  <line x1="248" y1="216" x2="312" y2="184" stroke="#495057" stroke-width="1.5" marker-end="url(#cb)"/>
  <!-- front face edges -->
  <line x1="88" y1="80" x2="230" y2="80" stroke="#495057" stroke-width="1.5" marker-end="url(#cb)"/>
  <line x1="80" y1="90" x2="80" y2="208" stroke="#495057" stroke-width="1.5" marker-end="url(#cb)"/>
  <line x1="240" y1="90" x2="240" y2="208" stroke="#495057" stroke-width="1.5" marker-end="url(#cb)"/>
  <line x1="88" y1="220" x2="230" y2="220" stroke="#495057" stroke-width="1.5" marker-end="url(#cb)"/>
  <!-- vertices -->
  <circle cx="80" cy="80" r="3.5" fill="#212529"/>
  <circle cx="240" cy="80" r="3.5" fill="#212529"/>
  <circle cx="80" cy="220" r="3.5" fill="#212529"/>
  <circle cx="240" cy="220" r="3.5" fill="#212529"/>
  <circle cx="160" cy="40" r="3.5" fill="#212529"/>
  <circle cx="320" cy="40" r="3.5" fill="#212529"/>
  <circle cx="160" cy="180" r="3.5" fill="#212529"/>
  <circle cx="320" cy="180" r="3.5" fill="#212529"/>
</svg>
