<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 620 240" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif">
  <!-- Indexing category of a savings program with a retirement branch (top),
       and its image under the information functor F (bottom).
       Condensed from the bellman-ddsl diagram-foundations examples. -->
  <defs>
    <marker id="ahi" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#676470"/></marker>
  </defs>

  <text x="16" y="22" font-size="15" fill="#1f476b" font-weight="600">&#8464;</text>
  <text x="30" y="22" font-size="12.5" fill="#676470">&#8202;: fields and declared transitions (free category on the graph)</text>

  <!-- top row: the indexing category -->
  <g>
    <rect x="30" y="42" width="92" height="40" rx="7" fill="#ffffff" stroke="#1f476b" stroke-width="1.6"/>
    <text x="76" y="58" font-size="10" fill="#676470" text-anchor="middle">FIELD</text>
    <text x="76" y="74" font-size="14" fill="#212529" text-anchor="middle">k</text>

    <rect x="232" y="42" width="100" height="40" rx="7" fill="#ffffff" stroke="#1f476b" stroke-width="1.6"/>
    <text x="282" y="58" font-size="10" fill="#676470" text-anchor="middle">FIELD</text>
    <text x="282" y="74" font-size="14" fill="#212529" text-anchor="middle">(m, y)</text>

    <rect x="472" y="14" width="110" height="40" rx="7" fill="#ffffff" stroke="#39b54a" stroke-width="1.6"/>
    <text x="527" y="30" font-size="10" fill="#676470" text-anchor="middle">FIELD</text>
    <text x="527" y="46" font-size="14" fill="#212529" text-anchor="middle">a (work)</text>

    <rect x="472" y="72" width="110" height="40" rx="7" fill="#ffffff" stroke="#f05a28" stroke-width="1.6"/>
    <text x="527" y="88" font-size="10" fill="#676470" text-anchor="middle">FIELD</text>
    <text x="527" y="104" font-size="14" fill="#212529" text-anchor="middle">a (retire)</text>

    <line x1="122" y1="62" x2="226" y2="62" stroke="#676470" stroke-width="1.4" marker-end="url(#ahi)"/>
    <text x="174" y="52" font-size="12.5" fill="#212529" text-anchor="middle">&#945;&#8321;</text>
    <text x="174" y="78" font-size="11" fill="#676470" text-anchor="middle">shocks &#936;, &#952;</text>

    <line x1="332" y1="54" x2="466" y2="38" stroke="#676470" stroke-width="1.4" marker-end="url(#ahi)"/>
    <text x="396" y="34" font-size="12.5" fill="#212529" text-anchor="middle">&#945;&#8322;&#695;</text>

    <line x1="332" y1="70" x2="466" y2="88" stroke="#676470" stroke-width="1.4" marker-end="url(#ahi)"/>
    <text x="396" y="96" font-size="12.5" fill="#212529" text-anchor="middle">&#945;&#8322;&#691;</text>
    <text x="399" y="63" font-size="11" fill="#676470" text-anchor="middle">choice d</text>
  </g>

  <!-- functor arrow -->
  <text x="292" y="138" font-size="17" fill="#1f476b" text-anchor="middle">&#8659;</text>
  <text x="312" y="138" font-size="14" fill="#1f476b"><tspan font-family="STIXGeneral, Times New Roman, serif">&#8497;</tspan></text>
  <text x="330" y="138" font-size="11.5" fill="#676470">information on arrival</text>

  <!-- bottom row: image under F, in the poset of sigma-algebras -->
  <g>
    <text x="76" y="180" font-size="13" fill="#212529" text-anchor="middle">&#963;(k&#8320;)</text>
    <text x="282" y="180" font-size="13" fill="#212529" text-anchor="middle">&#963;(k&#8320;, &#936;, &#952;)</text>
    <text x="527" y="150" font-size="13" fill="#212529" text-anchor="middle">&#963;(k&#8320;, &#936;, &#952;, d)</text>
    <text x="527" y="208" font-size="13" fill="#212529" text-anchor="middle">&#963;(k&#8320;, &#936;, &#952;, d)</text>

    <line x1="120" y1="176" x2="228" y2="176" stroke="#676470" stroke-width="1.3" marker-end="url(#ahi)"/>
    <text x="174" y="168" font-size="13" fill="#676470" text-anchor="middle">&#8838;</text>

    <line x1="340" y1="170" x2="462" y2="152" stroke="#676470" stroke-width="1.3" marker-end="url(#ahi)"/>
    <text x="398" y="152" font-size="13" fill="#676470" text-anchor="middle">&#8838;</text>

    <line x1="340" y1="184" x2="462" y2="202" stroke="#676470" stroke-width="1.3" marker-end="url(#ahi)"/>
    <text x="398" y="204" font-size="13" fill="#676470" text-anchor="middle">&#8838;</text>
  </g>

  <text x="310" y="232" font-size="11.5" fill="#676470" text-anchor="middle">every arrow of &#8464; lands on an inclusion: information only grows along transitions</text>
</svg>
