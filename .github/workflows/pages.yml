name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli

      - name: Build HTML decks
        run: |
          set -euo pipefail
          mkdir -p _site/categorical-types-and-agi _site/session-01-motivation

          marp "Categorical types and AGI -1.md" \
            -o _site/categorical-types-and-agi/index.html \
            --allow-local-files \
            --html

          marp talks/session-01-motivation/deck.md \
            -o _site/session-01-motivation/index.html \
            --allow-local-files \
            --html

          cp site-index.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
